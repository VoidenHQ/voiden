# Manual, throwaway verification for the VoidenHQ/homebrew-voiden tap — runs
# the exact user-facing commands (brew tap / brew install) on a real Linux
# machine (GitHub-hosted ubuntu-latest, not a simulation) after fixing a
# formula bug, since `ruby -c` only checks syntax, not whether Homebrew can
# actually load/install the formula. Not wired into any release pipeline;
# workflow_dispatch only, run on demand when the tap changes.
name: Test Homebrew Tap (Linux)

on:
  workflow_dispatch:

jobs:
  test:
    name: brew tap + install on real Linux
    runs-on: ubuntu-latest
    steps:
      - name: Install Homebrew
        run: |
          NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          # `brew --prefix` isn't usable yet here — brew itself isn't on PATH
          # until a later step picks up $GITHUB_PATH. Linuxbrew's install
          # location is fixed, so hardcode it instead of trying to ask brew.
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"

      - name: brew tap voidenhq/voiden
        run: brew tap voidenhq/voiden

      # Newer Homebrew refuses to load a formula from a third-party tap until
      # explicitly trusted — confirmed for real here: "Refusing to load
      # formula voidenhq/voiden/voiden from untrusted tap voidenhq/voiden."
      # Not a bug in the formula; a real Homebrew security gate every
      # third-party tap install needs, documented in HOMEBREW.md.
      - name: brew trust voidenhq/voiden
        run: brew trust voidenhq/voiden

      - name: brew install voiden
        run: brew install --verbose voiden

      - name: brew info voiden (confirm it's actually recognized as the formula, not a cask fallback)
        run: brew info voiden

      - name: Confirm the installed binary exists and is executable
        run: |
          which voiden
          file "$(which voiden)"
          ls -la "$(brew --prefix)/bin/voiden"

      - name: Try --version (best-effort — Electron GUI apps can fail headless even when the formula/install itself is correct)
        continue-on-error: true
        run: voiden --version || voiden --version --no-sandbox || echo "::warning::voiden --version didn't succeed headlessly — separate from whether the formula/tap/install itself worked, see steps above"
