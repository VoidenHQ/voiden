# Publishes the Linux .deb produced by "Release Voiden App" to the APT repo (S3)
# and the Snap Store.
#
# Split out of release-app.yml so a flaky apt/snap publish (e.g. transient
# snapd/core22 install failures on GitHub-hosted runners) can be retried on its
# own, without rebuilding macOS/Linux artifacts or re-cutting the GitHub Release.
#
# Trigger:
#   - workflow_call — invoked by release-app.yml right after the Linux build,
#     reusing that run's "voiden-linux-x64" artifact. Always runs every target.
#   - workflow_dispatch — manual retry. Defaults to pulling the artifact from
#     this same run; pass `run_id` to pull from an earlier "Release Voiden App"
#     run instead (e.g. retrying after the build already succeeded elsewhere).
#     The run_apt_snap / run_winget / run_chocolatey / run_nix_cache toggles let
#     you retry just the target(s) that failed, instead of re-running all four
#     (useful while iterating on a fix — no need to re-push to a real package
#     manager for every target each time).
#
# Required repository secrets:
#   S3_ACCESS_KEY_ID_BETA / S3_SECRET_ACCESS_KEY_BETA / S3_BUCKET_NAME_BETA
#   S3_ACCESS_KEY_ID_STABLE / S3_SECRET_ACCESS_KEY_STABLE / S3_BUCKET_NAME_STABLE
#   VOIDEN_GPG_PRIVATE_KEY / VOIDEN_GPG_KEY_ID / VOIDEN_GPG_PASSPHRASE — apt signing
#                                 (omit VOIDEN_GPG_PRIVATE_KEY to publish an unsigned repo)
#   SNAPCRAFT_STORE_CREDENTIALS — output of `snapcraft export-login -`
#   WINGET_GITHUB_TOKEN — classic PAT (public_repo scope) for the account that forks
#                         microsoft/winget-pkgs and opens the manifest-bump PR (beta + stable,
#                         separate package identifiers: Voiden.Voiden / Voiden.Voiden-Beta)
#   CHOCOLATEY_API_KEY — from https://community.chocolatey.org/account, after claiming
#                        the "voiden" package id there (beta + stable)
#   CACHIX_AUTH_TOKEN — auth token for a "voiden" cache created at https://app.cachix.org
#                       (beta + stable; builds straight from the flake, no S3/build
#                       artifact dependency)

name: Release Package Managers

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      run_apt_snap:
        required: false
        type: boolean
        default: true
      run_winget:
        required: false
        type: boolean
        default: true
      run_chocolatey:
        required: false
        type: boolean
        default: true
      run_nix_cache:
        required: false
        type: boolean
        default: true

  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        required: true
        type: choice
        options:
          - beta
          - stable
      run_id:
        description: 'Run ID of a "Release Voiden App" run to pull the linux-x64 .deb / win32-x64 .exe from (blank = this run)'
        required: false
        type: string
      run_apt_snap:
        description: 'Publish APT + Snap'
        required: false
        type: boolean
        default: true
      run_winget:
        description: 'Publish Winget'
        required: false
        type: boolean
        default: true
      run_chocolatey:
        description: 'Publish Chocolatey'
        required: false
        type: boolean
        default: true
      run_nix_cache:
        description: 'Publish Nix Cachix cache'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  publish:
    name: Publish APT + Snap
    if: inputs.run_apt_snap
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack (Yarn)
        run: corepack enable

      # Only need node_modules for publish-apt.js / publish-snap.js (dotenv, aws-sdk) —
      # no plugin builds needed to repackage an already-built .deb.
      - name: Install dependencies
        run: yarn install

      # Pre-install core22 (and wait for snapd to settle) before snapcraft's build
      # tries to auto-install it — doing both right after `snap install snapcraft`
      # races snapd and intermittently fails with "Error installing snap 'core22'".
      - name: Install snapcraft
        run: |
          sudo snap install snapcraft --classic
          sudo snap wait system seed.loaded
          sudo snap install core22

      - name: Download Linux build artifact
        uses: actions/download-artifact@v4
        with:
          name: voiden-linux-x64
          path: apps/electron/out/make/
          run-id: ${{ inputs.run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import GPG signing key
        env:
          VOIDEN_GPG_PRIVATE_KEY: ${{ secrets.VOIDEN_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$VOIDEN_GPG_PRIVATE_KEY" ]; then
            echo "$VOIDEN_GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          else
            echo "VOIDEN_GPG_PRIVATE_KEY not set — apt repo will publish unsigned."
          fi

      # Not mandatory for a successful release — apt/snap failures are reported but don't fail the job.
      - name: Publish APT repo
        id: publish-apt
        continue-on-error: true
        working-directory: apps/electron
        env:
          S3_ACCESS_KEY_ID_BETA: ${{ secrets.S3_ACCESS_KEY_ID_BETA }}
          S3_SECRET_ACCESS_KEY_BETA: ${{ secrets.S3_SECRET_ACCESS_KEY_BETA }}
          S3_ACCESS_KEY_ID_STABLE: ${{ secrets.S3_ACCESS_KEY_ID_STABLE }}
          S3_SECRET_ACCESS_KEY_STABLE: ${{ secrets.S3_SECRET_ACCESS_KEY_STABLE }}
          S3_BUCKET_NAME_BETA: ${{ secrets.S3_BUCKET_NAME_BETA }}
          S3_BUCKET_NAME_STABLE: ${{ secrets.S3_BUCKET_NAME_STABLE }}
          VOIDEN_GPG_KEY_ID: ${{ secrets.VOIDEN_GPG_KEY_ID }}
          VOIDEN_GPG_PASSPHRASE: ${{ secrets.VOIDEN_GPG_PASSPHRASE }}
        run: node publish-apt.js ${{ inputs.channel }}

      - name: Report APT publish failure
        if: steps.publish-apt.outcome == 'failure'
        run: echo "::warning::APT repo publish failed — continuing without it. Check the 'Publish APT repo' step logs." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish Snap
        id: publish-snap
        continue-on-error: true
        working-directory: apps/electron
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: node publish-snap.js ${{ inputs.channel }}

      - name: Report Snap publish failure
        if: steps.publish-snap.outcome == 'failure'
        run: echo "::warning::Snap Store publish failed — continuing without it. Check the 'Publish Snap' step logs." | tee -a "$GITHUB_STEP_SUMMARY"

  # ── winget (beta + stable) ──────────────────────────────────────────────────────
  # Doesn't need the Linux artifact — opens a manifest-bump PR against
  # microsoft/winget-pkgs referencing the already-published Windows installer URL
  # for the channel. Winget's own bot (wingetbot) validates and auto-merges from
  # there. Beta publishes under its own package identifier (Voiden.Voiden-Beta) so
  # a beta build's higher version number can't outrank stable as the default install.
  publish-winget:
    name: Publish Winget
    if: inputs.run_winget && (inputs.channel == 'beta' || inputs.channel == 'stable')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Not mandatory for a successful release — reported but doesn't fail the job.
      - name: Publish Winget manifest
        id: publish-winget
        continue-on-error: true
        working-directory: apps/electron
        env:
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
        run: node publish-winget.js ${{ inputs.channel }}

      - name: Report Winget publish failure
        if: steps.publish-winget.outcome == 'failure'
        run: echo "::warning::Winget manifest publish failed — continuing without it. Check the 'Publish Winget manifest' step logs." | tee -a "$GITHUB_STEP_SUMMARY"

  # ── chocolatey (beta + stable) ─────────────────────────────────────────────────
  # choco.exe is Windows-only, so this needs its own runner + the win32-x64
  # artifact (unlike apt/snap/winget, which don't need a Windows build at all).
  # Beta versions (e.g. 2.3.0-beta.1) publish as a Chocolatey prerelease.
  publish-chocolatey:
    name: Publish Chocolatey
    if: inputs.run_chocolatey && (inputs.channel == 'beta' || inputs.channel == 'stable')
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download Windows build artifact
        uses: actions/download-artifact@v4
        with:
          name: voiden-win32-x64
          path: apps/electron/out/make/
          run-id: ${{ inputs.run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Not mandatory for a successful release — reported but doesn't fail the job.
      - name: Publish Chocolatey package
        id: publish-chocolatey
        continue-on-error: true
        working-directory: apps/electron
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: node publish-choco.js ${{ inputs.channel }}

      - name: Report Chocolatey publish failure
        if: steps.publish-chocolatey.outcome == 'failure'
        shell: bash
        run: echo "::warning::Chocolatey publish failed — continuing without it. Check the 'Publish Chocolatey package' step logs." | tee -a "$GITHUB_STEP_SUMMARY"

      # Uploads the built .nupkg regardless of whether `choco push` above
      # succeeded — lets a failed automated push be retried manually (e.g. via
      # community.chocolatey.org's web upload) without rebuilding anything.
      - name: Upload .nupkg artifact
        if: always() && steps.publish-chocolatey.outputs.nupkg_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: voiden-chocolatey-nupkg
          path: ${{ steps.publish-chocolatey.outputs.nupkg_path }}
          if-no-files-found: ignore

  # ── nix binary cache (beta + stable) ──────────────────────────────────────────
  # `nix run github:VoidenHQ/voiden` already builds straight from this repo — there's
  # no separate registry to "publish" to. This just warms a Cachix binary cache so
  # that build substitutes a prebuilt result instead of compiling Electron + native
  # modules from source on every user's machine. Independent of the Electron Forge
  # build entirely — builds directly from the flake.
  #
  # Covers the two natively available GitHub-hosted runner architectures
  # (x86_64-linux, aarch64-darwin). aarch64-linux and x86_64-darwin would need
  # emulation or self-hosted runners and aren't covered yet.
  publish-nix-cache:
    name: Publish Nix Cache — ${{ matrix.label }}
    if: inputs.run_nix_cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86_64-linux
            os: ubuntu-latest
          - label: aarch64-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      # Pushes every new store path built in subsequent steps to the "voiden"
      # cache automatically (via a post-build hook) — no explicit `cachix push`.
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: voiden
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Not mandatory for a successful release — reported but doesn't fail the job.
      - name: Build voiden package
        id: nix-build
        continue-on-error: true
        run: nix build .#voiden --print-build-logs

      - name: Report Nix build/push failure
        if: steps.nix-build.outcome == 'failure'
        run: echo "::warning::Nix build/cache push failed for ${{ matrix.label }} — continuing without it. Check the 'Build voiden package' step logs." | tee -a "$GITHUB_STEP_SUMMARY"
