# Guards against a regression that has already happened twice: yarn-project.nix
# is auto-generated by `yarn install` (via the yarn-nixify plugin), and that
# generator has no idea the yarn-cache derivation's `outputHash` needs to be a
# per-system attrset — this project's dependency tree resolves different
# optional/native packages per platform, so a single shared hash only ever
# matches one of them.
#
# History: the per-system split was added in a6d506d after x86_64-linux
# started failing with "hash mismatch in fixed-output derivation" while
# aarch64-darwin kept passing. A later `yarn install` (after a yarn.lock
# change) silently regenerated yarn-project.nix back down to one shared
# hash, and the exact same x86_64-linux failure reappeared in the v2.3.0
# stable release — undetected until "Release Package Managers" actually ran,
# because that step is continue-on-error and doesn't fail the release.
#
# This runs at PR/push time instead, on the one thing that actually predicts
# the failure: whether outputHash is still shaped as a per-system dispatch,
# not the exact hash values (which legitimately change every time yarn.lock
# does — a plain diff would flag every dependency bump as suspicious).
#
# Trigger: push/PR touching yarn.lock or yarn-project.nix, main/beta only.

name: Nix Yarn-Cache Hash Guard

on:
  push:
    branches: [main, beta]
    paths:
      - 'yarn.lock'
      - 'yarn-project.nix'
  pull_request:
    branches: [main, beta]
    paths:
      - 'yarn.lock'
      - 'yarn-project.nix'

jobs:
  guard:
    name: Verify yarn-project.nix keeps its per-system outputHash
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check outputHash shape
        run: |
          if grep -qE '^\s*outputHash = "sha[0-9]+-' yarn-project.nix; then
            echo "::error file=yarn-project.nix::outputHash is a single shared hash again — it must be a per-system attrset dispatching on \`stdenv.system\` (see the comment directly above outputHash in yarn-project.nix). This exact regression has already happened twice (commit a6d506d, then again in the v2.3.0 stable release) because \`yarn install\` regenerates this file and has no idea the per-system split exists. To fix: for each system that needs one, build once with any placeholder hash, take the real value from the 'got:' line of the resulting 'hash mismatch in fixed-output derivation' error, and put it back under .\${stdenv.system} — same as the comment in the file describes."
            exit 1
          fi

          if ! grep -q 'stdenv.system' yarn-project.nix; then
            echo "::error file=yarn-project.nix::the per-system outputHash dispatch (stdenv.system) appears to have been removed from yarn-project.nix entirely, not just collapsed to one value."
            exit 1
          fi

          echo "OK — yarn-project.nix's outputHash still dispatches per system."
